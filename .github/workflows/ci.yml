name: TuongGPT v2 CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build runtime image
        run: |
          docker build --target runtime -t tuonggpt-v2:runtime .

      - name: Build test image
        run: |
          docker build --target test -t tuonggpt-v2:test .

      - name: Run Flake8 checks
        run: |
          docker run --rm tuonggpt-v2:test flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=venv,.venv,chroma_db,uploads

      - name: Run unit tests
        run: |
          docker run --rm \
            -e DATABASE_URL="sqlite:///./test_ci.db" \
            -e JWT_SECRET_KEY="mock_secret_key_ci_testing_2026" \
            -e JWT_ALGORITHM="HS256" \
            -e ACCESS_TOKEN_EXPIRE_MINUTES="30" \
            tuonggpt-v2:test pytest tests/
